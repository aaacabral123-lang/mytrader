<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robô">
<title>MyTrader | Painel do robô</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080f1d;color:#e9f1ff;
  --panel:#121e32;--line:#283851;--inner:#0d182a;--muted:#9aabc6;--up:#86e0ba;--down:#ffa4af;--accent:#4486ff}
*{box-sizing:border-box}
body{margin:0 auto;padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));max-width:760px;background:#080f1d}
header{padding:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0}
h2{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted)}
.tag{background:#173b39;color:#8ce2c7;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.hero .label{font-size:13px;color:var(--muted)}
.big{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.delta{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--inner);padding:12px;border-radius:13px}
.stat span{font-size:12px;color:var(--muted)}
.stat strong{display:block;font-size:19px;margin-top:4px;font-variant-numeric:tabular-nums}
#chart{width:100%;height:170px;display:block}
.chart-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.pos{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
.pos:first-of-type{border-top:0;padding-top:0}
.pos .sym{font-weight:800;font-size:16px}
.pos .name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pos .pl{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;background:var(--inner);border-radius:3px;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.meta{grid-column:1/-1;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.op{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.op:first-of-type{border-top:0;padding-top:0}
.op b{font-variant-numeric:tabular-nums}
.op small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pill{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;margin-right:6px}
.pill.buy{background:#153d35;color:#a6f0d6}.pill.sell{background:#512b35;color:#ffd0d7}.pill.short{background:#2b3560;color:#c3ccff;margin:0 0 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--muted);font-weight:600;font-size:11px;padding:0 0 8px}
td{text-align:right;padding:8px 0;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td.in{color:var(--up);font-weight:800}
.notice{border-radius:12px;padding:12px;background:#24334b;color:#d7e4f7;font-size:13px;line-height:1.5}
.warn{background:#493721;color:#ffe4ae}
.ok{background:#153d35;color:#a6f0d6;margin:12px 0}
a{color:#8fb6ff}
footer{font-size:12px;color:#8fa0b9;line-height:1.6;margin-top:18px}
button{background:#1d3354;border:1px solid #355174;color:#fff;padding:9px 12px;border-radius:11px;font-weight:700;font-size:13px;cursor:pointer}
.empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
  <div><h1>Robô MyTrader</h1><div class="muted" id="updated">carregando…</div></div>
  <span class="tag">PAPER</span>
</header>

<div id="app"></div>

<footer>
  Conta <b>paper</b> da Alpaca (dinheiro falso). O painel mostra só o que pertence ao robô e atualiza a cada rodada
  (de 30 em 30 min, com a bolsa de NY aberta). Não é recomendação de investimento.
</footer>

<script>
const $ = s => document.querySelector(s);
const usd = v => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const sign = v => (v > 0 ? "+" : "") ;
const pct = v => sign(v) + v.toLocaleString("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "";
const when = iso => new Date(iso).toLocaleString("pt-BR", {timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return "há " + min + " min";
  if (min < 48 * 60) return "há " + Math.round(min / 60) + " h";
  return "em " + when(iso);
}

function chart(hist, start) {
  if (hist.length < 2) return '<p class="empty">O gráfico aparece depois de algumas rodadas.</p>';
  const W = 600, H = 170, P = 6;
  const vals = hist.map(h => h.v).concat([start]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { hi += 1; lo -= 1; }
  const x = i => P + i * (W - 2 * P) / (hist.length - 1);
  const y = v => P + (hi - v) * (H - 2 * P) / (hi - lo);
  const pts = hist.map((h, i) => x(i).toFixed(1) + "," + y(h.v).toFixed(1));
  const last = hist[hist.length - 1].v;
  const color = last >= start ? "#86e0ba" : "#ffa4af";
  return `<svg id="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução do patrimônio">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${y(start)}" y2="${y(start)}" stroke="#4a5d7c" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
    <polygon points="${x(0)},${H} ${pts.join(" ")} ${x(hist.length - 1)},${H}" fill="url(#g)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
  </svg>
  <div class="chart-foot"><span>${when(hist[0].t)}</span><span>tracejado = início (${usd(start)})</span><span>${when(hist[hist.length - 1].t)}</span></div>`;
}

function shortTerm(c) {
  if (!c) return "";
  const rows = c.positions.map(p => `
    <div class="pos">
      <div><div class="sym">${esc(p.symbol)}</div><div class="name">desde ${p.since ? p.since.split("-").reverse().join("/") : "?"}</div></div>
      <div><div class="val">${usd(p.value)}</div><div class="pl ${cls(p.pl)}">${sign(p.pl)}${usd(p.pl)} (${pct(p.pl_pct)})</div></div>
      <div class="meta">${p.qty.toFixed(4)} cotas · entrada ${usd(p.avg)} · agora ${usd(p.price)}</div>
    </div>`).join("") || '<p class="empty">Sem posição agora. Ele compra quando um ETF em alta tem uma queda forte de 2 a 3 dias.</p>';
  return `<div class="panel"><h2>Curto prazo (ETFs)</h2>
    <p class="muted" style="font-size:12px;margin:-6px 0 10px">${usd(c.value)} · <span class="${cls(c.change)}">${sign(c.change)}${usd(c.change)} (${pct(c.change_pct)})</span> desde ${usd(c.start)} · caixa ${usd(c.cash)}</p>
    ${rows}</div>`;
}

function render(d) {
  $("#updated").textContent = "atualizado " + ago(d.as_of);
  const target = Object.fromEntries((d.targets || []).map(t => [t.ticker, t.weight]));
  const positions = d.positions.map(p => `
    <div class="pos">
      <div><div class="sym">${esc(p.symbol)}</div><div class="name">${esc(p.name)}</div></div>
      <div><div class="val">${usd(p.value)}</div><div class="pl ${cls(p.pl)}">${sign(p.pl)}${usd(p.pl)} (${pct(p.pl_pct)})</div></div>
      <div class="bar"><i style="width:${Math.min(100, p.weight * 2)}%"></i></div>
      <div class="meta">${p.qty.toFixed(4)} ações · preço médio ${usd(p.avg)} · agora ${usd(p.price)} · ${p.weight.toFixed(1)}% da carteira</div>
    </div>`).join("") || '<p class="empty">Nenhuma ação ainda. A primeira compra acontece na primeira rodada com a bolsa aberta.</p>';

  const fills = (d.fills || []).slice(0, 12).map(f => `
    <div class="op">
      <div><span class="pill ${f.side}">${f.side === "buy" ? "COMPRA" : "VENDA"}</span><b>${esc(f.symbol)}</b>${f.sleeve === "curto" ? ' <span class="pill short">CURTO</span>' : ""}
        <small>${f.qty.toFixed(4)} ações a ${usd(f.price)} · ${when(f.at)}</small></div>
      <b>${usd(f.amount)}</b>
    </div>`).join("") || '<p class="empty">Nenhuma operação ainda.</p>';

  const picks = (d.picks || []).length ? `
    <div class="panel"><h2>Por que essas ações</h2>
      <p class="muted" style="font-size:12px;margin:-6px 0 10px">Regras do screener: ${esc(d.rules)}</p>
      <table><tr><th>Ação</th><th>Receita 12m</th><th>Margem op.</th><th>P/L</th><th>Nota</th></tr>
      ${d.picks.map(p => `<tr><td class="${p.held ? "in" : ""}">${esc(p.symbol)}${p.held ? " ●" : ""}</td>
        <td>${p.growth == null ? "–" : pct(p.growth)}</td><td>${p.margin == null ? "–" : p.margin.toLocaleString("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + "%"}</td>
        <td>${p.pe == null ? "–" : p.pe.toLocaleString("pt-BR", {minimumFractionDigits: 1, maximumFractionDigits: 1})}</td><td>${p.score == null ? "–" : p.score.toLocaleString("pt-BR")}</td></tr>`).join("")}
      </table><p class="muted" style="font-size:11px;margin:8px 0 0">● = na carteira do robô</p></div>` : "";

  const cool = Object.entries(d.cooldown || {});
  const notes = [
    d.pending ? `<div class="notice warn">${d.pending} ordem(ns) aguardando execução na Alpaca.</div>` : "",
    ...Object.entries(d.takeprofit || {}).map(([s, t]) => `<div class="notice ok">Lucro realizado em <b>${esc(s)}</b>: vendida a ${usd(t.sold_at)}. Recompra abaixo de ${usd(t.rebuy_below)} ou em ${t.until.split("-").reverse().join("/")}.</div>`),
    cool.length ? `<div class="notice warn">Fora da carteira por stop: ${cool.map(([s, u]) => esc(s) + " até " + u.split("-").reverse().join("/")).join(", ")}.</div>` : ""
  ].join("");
  const report = d.report && d.repo ? `<a href="https://github.com/${d.repo}/blob/main/${d.report}">Abrir o relatório de hoje</a>` : "";

  $("#app").innerHTML = `
    <div class="panel hero">
      <div class="label">Patrimônio do robô</div>
      <div class="big">${usd(d.total)}</div>
      <div class="delta ${cls(d.change)}">${sign(d.change)}${usd(d.change)} (${pct(d.change_pct)}) desde o início</div>
      <div class="stats">
        <div class="stat"><span>Longo prazo</span><strong>${usd(d.long_value ?? d.total)}</strong></div>
        <div class="stat"><span>Curto prazo</span><strong>${d.curto ? usd(d.curto.value) : "–"}</strong></div>
        <div class="stat"><span>Começou com</span><strong>${usd(d.start)}</strong></div>
        <div class="stat"><span>Operações</span><strong>${(d.fills || []).length}</strong></div>
      </div>
    </div>
    ${notes}
    <div class="panel"><h2>Evolução</h2>${chart(d.history || [], d.start)}</div>
    <div class="panel"><h2>Longo prazo</h2>
      <p class="muted" style="font-size:12px;margin:-6px 0 10px">Em ações ${usd(d.invested)} · caixa ${usd(d.cash)}</p>${positions}</div>
    ${shortTerm(d.curto)}
    <div class="panel"><h2>Últimas operações</h2>${fills}</div>
    ${picks}
    <div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span>${report || '<span class="muted">O relatório do dia aparece aqui.</span>'}</span>
      <button onclick="load()">Atualizar</button>
    </div>`;
}

async function load() {
  try {
    const r = await fetch("dados.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    $("#updated").textContent = "ainda sem dados";
    $("#app").innerHTML = `<div class="notice">O robô ainda não rodou com a bolsa aberta. A primeira rodada é no próximo pregão,
      às 10h30 (horário de Brasília). Depois disso, este painel mostra o saldo, a carteira e as operações.</div>`;
  }
}
load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>

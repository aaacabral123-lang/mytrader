name: Robô MyTrader (paper)

on:
  schedule:
    # Trading shifts: each one runs the robot every 30 minutes until the market closes or the
    # job's ~6 h limit (bot/turno.py), so a late or skipped start costs at most one shift.
    # Times in UTC; they cover NYSE hours in summer (13:30-20:00) and winter (14:30-21:00).
    # A shift that starts while another runs waits in the queue and picks up where it stops.
    - cron: "20 13 * * 1-5"
    - cron: "50 14 * * 1-5"
    - cron: "50 16 * * 1-5"
    - cron: "50 19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem enviar ordens"
        type: boolean
        default: false
      turno:
        description: "Turno inteiro (rodar até a bolsa fechar) em vez de uma rodada só"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pdftotext (para ler as declarações dos políticos)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Rodar o robô
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "mytrader-robo"
          git config user.email "mytrader-robo@users.noreply.github.com"
          python3 bot/turno.py ${{ (github.event_name == 'workflow_dispatch' && !inputs.turno) && '--once' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Salvar estado e diário
        if: always()
        run: |
          git config user.name "mytrader-robo"
          git config user.email "mytrader-robo@users.noreply.github.com"
          git add trader painel
          git diff --cached --quiet && exit 0
          git commit -m "robô: rodada $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet && git push

name: Teste no passado

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o teste
        run: python3 bot/backtest.py

      - name: Otimizar o curto prazo (treino 2007-2016, prova 2017 em diante)
        run: python3 bot/otimiza.py

      - name: Testar pares de empresas correlacionadas
        run: python3 bot/pares.py

      - name: Simular os últimos 10 anos com as carteiras do robô
        run: python3 bot/simula10.py

      - name: Testar plano B para quedas (caixa, SH, SQQQ)
        run: python3 bot/backup.py

      - name: Testar proteção só na queda (pares + DBMF/KMLM/GLD/TLT/SH/caixa)
        run: python3 bot/protecao.py

      - name: Salvar o resultado
        run: |
          git config user.name "mytrader-robo"
          git config user.email "mytrader-robo@users.noreply.github.com"
          git add trader/backtest
          git diff --cached --quiet && exit 0
          git commit -m "teste no passado: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && exit 0; sleep 5; done
          exit 1
